  - content: "---\npackages:\n  npm:@vx-oss/docs-sanity:\n    type: patch\n---\n\n## Support `@sanity/client` v8 and `next-sanity` v13\n\nWidened the peer dependency ranges to `^7.22.0 || ^8.0.0` and `^12.4.0 || ^13.0.0` respectively.\n"
    filename: 2026-08-28-sanity-peer-ranges.md
    v: 0.0.0
